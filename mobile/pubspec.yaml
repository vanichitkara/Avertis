name: avertis
description: "Avertis — adaptive disaster-response intelligence. Mobile node."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Local persistence — reports must survive a process death offline.
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # Gateway client
  dio: ^5.7.0

  # Device capabilities
  flutter_blue_plus: ^1.34.5
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  record: ^6.1.2
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.23.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
